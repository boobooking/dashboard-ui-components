name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Обычная установка тянет последнюю минорную версию Vue, поэтому заявленная
  # нижняя граница иначе осталась бы непроверенной.
  vue-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save vue@3.2
      - run: npm test
      - run: npm run build
