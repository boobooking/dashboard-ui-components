name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Тег может не совпадать с версией в package.json (например, тег
      # поставили повторно на коммит, где версию забыли поднять). Публикация
      # в этом случае уйдёт не туда, куда указывает тег, и упадёт конфликтом
      # версии в npm — проверяем заранее и останавливаемся с понятной ошибкой.
      - name: Сверить тег с версией пакета
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Тег $GITHUB_REF_NAME (версия $TAG_VERSION) не совпадает с version в package.json ($PACKAGE_VERSION)" >&2
            exit 1
          fi
      # Публикация идёт по доверенному издателю через OIDC, токен не нужен.
      # Скоуп-пакеты по умолчанию публикуются приватными.
      # В реестре осталась ошибочно выпущенная версия 1.0.0, она выше по семантике версий,
      # поэтому npm отказывается переставлять метку latest неявно — требуется явное указание.
      - run: npm publish --access public --tag latest
